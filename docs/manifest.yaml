# chronicle's docs manifest
# Schema: forgecraft canonical (see schema_source below)
#
# Chronicle is in a legacy state similar to forgecraft — many docs are at
# docs/ root rather than in canonical subdirectories. The overrides below
# map the canonical slots to where files currently live. New documents go
# into the canonical paths.

schema_source: ../../forge/forgecraft-mcp/templates/docs-manifest.yaml
# When a published URL is available, prefer:
# schema_source: https://forgecraft.tools/schemas/docs-manifest.v1.yaml

project:
  name: chronicle
  type: tool                 # MCP server for tiered AI memory
  release_phase: maintenance

# ── Path overrides (legacy mapping) ─────────────────────────────────────
overrides:
  # Specs: legacy single-files at docs/ root
  documents.specs.legacy_files:
    - docs/PRD.md
    - docs/spec.md
    - docs/chronicle-spec.md

  # ADRs: now consolidated into docs/adrs/active/ (canonical). README.md remains
  # at docs/adrs/ as a meta-file about the convention.

  # Use cases: legacy single-file
  documents.use_cases.legacy_files:
    - docs/use-cases.md

  # Roadmaps: legacy single file (auto-generated by forgecraft)
  documents.roadmaps.legacy_files:
    - docs/roadmap.md

  # Schemas: legacy locations
  documents.schemas.legacy_paths:
    - docs/diagrams/

  # Contracts: legacy
  documents.contracts.legacy_files:
    - docs/TechSpec.md

  # Session prompts: matches canonical default; initial.md was moved here from docs/session-prompt-initial.md
  documents.session_prompts.path: docs/session-prompts/

# ── Cascade — softer enforcement during legacy migration ───────────────
cascade_overrides:
  feat.severity: warning
  fix.severity: warning
  fix.require_regression_test: true

# ── Human-judgment ─────────────────────────────────────────────────────
human_judgment_overrides:
  min_reviewers: 0           # solo project; PR + checks still required
  block_ai_only_merge: false

# ── Migration status ───────────────────────────────────────────────────
migration:
  done:
    - consolidated docs/adrs/* into docs/adrs/active/ (kept README.md at docs/adrs/)
    - moved docs/session-prompt-initial.md → docs/session-prompts/initial.md
  todo:
    # The following moves require coordinated source-code updates in chronicle and forgecraft.
    # Defer until forgecraft introduces manifest-aware path resolution (see follow-up in forgecraft).
    - move docs/PRD.md, docs/spec.md, docs/chronicle-spec.md → docs/specs/
    - split docs/use-cases.md into docs/use-cases/UC-*.md
    - split docs/roadmap.md into docs/roadmaps/active/RM-*.md
    - move docs/diagrams/* → docs/schemas/
    - move docs/TechSpec.md → docs/contracts/
    - move legacy one-offs (review-verdict.md, security-audit.md, forge-status.md) into docs/decisions/ with date prefix
