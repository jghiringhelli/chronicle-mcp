name: CI

# The Defended property scores 0 until gates actually run. This file is the gate.
#
# The test job runs a Node MATRIX (the floor of `engines.node` and the current LTS) rather than a
# single pinned version. That is not thoroughness for its own sake, and it has now paid for itself
# twice: under the per-ABI driver, Node 24 failed with a bindings error that reads like a code bug;
# and on 2026-09-12 this matrix caught `engines.node: ">=20"` while better-sqlite3@13 requires
# `>=22` — Node 20 did not throw, it SEGFAULTED (exit 139), which no amount of unit testing on one
# developer's Node 24 would ever have surfaced. See ADR-022 and .claude/ledger.md.
#
# Keep the low end of this matrix equal to the lower bound of `engines.node`. A matrix that does not
# include the floor is not testing the claim, and `scripts/check-dependency-policy.mjs` rule 9 only
# checks that the floor is high enough, not that anyone ran it.

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly, for the jobs that need a live credential and should not run on every push.
    - cron: '0 6 * * *'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # Dependency-free and fast: fails a broken specification surface before anything installs.
  cascade:
    name: Cascade and sentinel integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: GS cascade check
        run: node scripts/gs-cascade-check.mjs
      - name: Record evidence
        if: always()
        run: |
          mkdir -p reports
          node scripts/gs-cascade-check.mjs --json > reports/cascade-check.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cascade-check
          path: reports/cascade-check.json

  verify:
    name: Types, lint, tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Native binding loads (ADR-015 — the NAPI claim, not an assumption)
        run: node -e "const D=require('better-sqlite3'); new D(':memory:').exec('create table t(a)'); console.log('better-sqlite3 ok on', process.version)"

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint (includes the import-cycle and layer-boundary gates)
        run: pnpm run lint

      - name: Tests with coverage (ratchet floor, see vitest.config.ts)
        run: pnpm run test:coverage

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-node${{ matrix.node }}
          path: coverage/

  # Generative execution: drive the BUILT server as a real MCP client over stdio, including two
  # concurrent instances on one database (ADR-016). This is the Executable property — contracts
  # run against a live runtime rather than inferred from a clean compile. It caught a defect the
  # 119-test unit suite did not: `session end` ignored its `project` argument.
  generative-execution:
    name: MCP smoke against the built server
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Configure a throwaway home so the run never touches a real ~/.chronicle
        run: |
          git config --global user.email "ci@example.com"
      - run: pnpm run smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mcp-smoke
          path: docs/evidence/mcp-smoke.json

  # Separate job: mutation is slow, and its verdict is independent of the rest.
  # Coverage measures what executed; mutation measures what was caught.
  mutation:
    name: Mutation gate (ratchet floor, see stryker.config.json)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Stryker
        run: pnpm run test:mutation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: reports/mutation/

  # Architectural correctness and supply-chain safety are orthogonal: a repo can score full
  # marks on every structural property and still ship high-severity CVEs pulled in by an
  # unconstrained dependency chain. So the dependency policy is gated separately.
  supply-chain:
    name: Supply chain (zero HIGH/CRITICAL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high
      - name: Approved-library check
        run: node scripts/check-dependency-policy.mjs

  # The latency claims in spec §5 are measured, not asserted (ADR-021). This job keeps them honest:
  # it runs the benchmark and uploads the record. It deliberately does NOT fail the build on a miss —
  # a hosted runner's timings are too noisy to gate on, and a flaky performance gate teaches people to
  # ignore red. The numbers are for reading; the verdicts are in the artifact and the log.
  benchmark:
    name: NFR benchmark (measured, not gated)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      - name: Measure NFR-02 / 03 / 04
        run: pnpm run bench

      - name: Print the verdicts, including how this runner compares
        if: always()
        run: |
          node -e "
          const r = require('./docs/evidence/nfr-bench.json');
          console.log('machine:', r.machine.platform, r.machine.cpus + ' cpus', r.machine.node);
          const v = (ms, t) => ms <= t ? 'MEETS' : 'MISSES';
          // Cold and steady are printed separately on purpose: NFR-02 and NFR-04 sit on a warm-up
          // curve, and collapsing them to one figure is how 251ms and 363ms were once recorded as
          // verified (docs/spec.md section 5, 'How these are measured').
          const warm = (x) => x.steadyMedian === undefined ? '' : '  (steady ~' + x.steadyMedian + 'ms, ' + x.n + ' samples ' + x.min + '-' + x.max + 'ms)';
          const c = r.nfr02_cold_start;
          console.log('NFR-02 cold start ' + c.ms + 'ms / ' + c.target + 'ms ' + v(c.ms, c.target) + warm(c));
          for (const x of r.nfr03_recall) console.log('NFR-03 recall @' + x.storeSize + ' p95 ' + x.p95 + 'ms / ' + x.target + 'ms ' + v(x.p95, x.target));
          if (r.nfr04_decay_pass) { const d = r.nfr04_decay_pass; console.log('NFR-04 decay @' + d.storeSize + ' ' + d.ms + 'ms / ' + d.target + 'ms ' + v(d.ms, d.target) + warm(d)); }
          "

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nfr-bench
          path: docs/evidence/nfr-bench.json

  # Generative execution against the REAL cloud mirror (ADR-018 §3, ADR-019, ADR-020).
  #
  # Secret-gated and scheduled rather than per-push, for three reasons: it needs a live Postgres
  # credential, it writes to a database a partner shares, and a push-triggered job on a fork would
  # expose the secret. A missing secret produces an explicit skip, not a failure — a red X nobody can
  # fix is noise, but a silent pass would be a lie.
  cloud-verify:
    name: Cloud verification (real Postgres)
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      - name: Is a credential configured for this run?
        id: creds
        run: echo "present=${{ secrets.CHRONICLE_CLOUD_URL != '' }}" >> "$GITHUB_OUTPUT"

      - name: Git identity, because userId is derived from it on first run
        if: steps.creds.outputs.present == 'true'
        run: git config --global user.email "ci@example.com"

      - name: Inspect the mirror (read-only)
        if: steps.creds.outputs.present == 'true'
        env:
          CHRONICLE_CLOUD_URL: ${{ secrets.CHRONICLE_CLOUD_URL }}
        run: pnpm run cloud:inspect

      - name: Cross-machine sync, scopes and the conflict policy
        if: steps.creds.outputs.present == 'true'
        env:
          CHRONICLE_CLOUD_URL: ${{ secrets.CHRONICLE_CLOUD_URL }}
        run: pnpm run cloud:verify-sync

      # The token is passed IN rather than read from the database. `team_licenses` is admin-only by
      # ADR-019 — a licence token is a credential, not team knowledge — and verify-isolation asserts
      # as a PASS that an app role cannot read it. Without this the job asked for exactly what the
      # security model exists to refuse and died on `permission denied for table team_licenses`.
      # A team token is also the smaller of the two credentials: it reaches team-shared knowledge,
      # which is shared by design, and reaches nobody's personal rows. If it is unset the script
      # reports NOT VERIFIED and exits 0, rather than failing or quietly passing.
      - name: Team layer against the real mirror (read-only)
        if: steps.creds.outputs.present == 'true'
        env:
          CHRONICLE_CLOUD_URL: ${{ secrets.CHRONICLE_CLOUD_URL }}
          CHRONICLE_TEAM_TOKEN: ${{ secrets.CHRONICLE_TEAM_TOKEN }}
        run: pnpm run cloud:verify-team

      - name: Did the team layer actually get verified?
        if: steps.creds.outputs.present == 'true'
        run: |
          node -e "
          const r = require('./docs/evidence/team-cloud-verify.json');
          if (r.verified === false) {
            console.log('::warning::team layer NOT verified: ' + r.reason);
          } else {
            console.log('team layer verified: ' + r.passed + '/' + (r.passed + r.failed) +
                        ' via ' + r.token_from);
          }
          "

      - name: Not verified, and saying so
        if: steps.creds.outputs.present != 'true'
        run: |
          echo "::warning::CHRONICLE_CLOUD_URL is not set, so the cloud path was NOT verified in this run."
          echo "This is a skip, not a pass. Set the repository secret to enable it."

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloud-verify
          path: docs/evidence/*-verify.json
          if-no-files-found: ignore

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
