id: no-redundant-deploy-pipelines
title: No Redundant Deploy Pipelines
description: >-
  Warns when a project has both a platform deploy config (railway.toml,
  vercel.json, fly.toml, render.yaml) and a .github/workflows/ directory. Both
  pipelines trigger on push, creating duplicate CI/CD runs and conflicting
  deployments.
